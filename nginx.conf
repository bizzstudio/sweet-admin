# =========================================================================
# Nginx — הגשת ה-React SPA של tomer-admin + proxy ל-backend
# =========================================================================

# שם השירות "backend" נפתר אוטומטית ברשת הפנימית של docker-compose,
# והפורט הפנימי של ה-backend הוא 3042.
upstream backend_upstream {
    server backend:3042;
}

server {
    listen 80;
    server_name _;

    # שורש קבצי ה-build הסטטיים
    root /usr/share/nginx/html;
    index index.html;

    # תמיכה בקבצים גדולים (העלאות תמונות וכו')
    client_max_body_size 16m;

    # ----- העברת בקשות API ל-backend -----
    # כל בקשה ל-/api/... מנותבת לקונטיינר ה-backend.
    location /api/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ----- חיבורי WebSocket (socket.io / התראות) -----
    location /socket.io/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # ----- React SPA -----
    # ניתוב צד-לקוח: כל נתיב שלא נמצא כקובץ מוחזר ל-index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ----- מטמון לנכסים סטטיים -----
    location /@/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
